DLS_Controller:
  ros__parameters:
    controller_frequency: 60.0
    show_logs: true
    deadzone_velocity: 0.002      
    deadzone_twist: 0.008         
    timeout_age: 0.1              
    deadzone_translation_error: 0.002
    deadzone_orientation_error: 0.008
    position_gain: 2.2
    orientation_gain: 1.0
    DLS_damping: 0.005
    use_velocity_limit: true
    use_acceleration_limit: true
    max_velocity: [60.0, 60.0, 60.0, 60.0, 60.0, 60.0]
    max_acceleration: [30.0, 30.0, 30.0, 30.0, 30.0, 30.0]
    braking_delay: 0.01
    stopping_margin: 0.005
    brake_damping_gain: 0.75
    velocity_weight: 1.0
    position_weight: 1.0
    position_priority_distance: 0.01
    position_priority_max_multiplier: 10.0
    end_effector_name: "ee_link"

# double braking_delay_;            // seconds
# double stopping_margin_;          // meters
# double velocity_damping_gain_;    // dimensionless